server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the Vite dev proxy in vite.config.js: /api is stripped and the
    # request is forwarded to the API service. The trailing slash on
    # proxy_pass is what strips the prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Slightly above the API's own 10 MB upload cap so the API is the one
        # that produces the error message.
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }

    # Single-page app: unknown routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames from the Vite build are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
