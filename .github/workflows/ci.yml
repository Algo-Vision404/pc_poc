name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # CPU wheels only — the default PyPI torch wheel pulls ~2.5 GB of CUDA
      # libraries this job does not need.
      - name: Install torch (CPU)
        run: |
          pip install torch==2.14.1 torchvision==0.29.1 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-export.txt
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      # The coverage floor is 95, not the current 97: enough headroom that
      # ordinary edits do not trip it, but a new untested module cannot land.
      - name: Test
        run: pytest --tb=short --cov=per_camera --cov-report=term --cov-fail-under=95

  ui:
    name: Dashboard — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Resolves the full dependency tree from the pinned set and fails on any
      # known advisory. Verified locally: "No known vulnerabilities found".
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-export.txt
